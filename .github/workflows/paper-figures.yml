---
name: uybor-paper-figures

# Dispatch-only. Builds the working paper's figures on live data frozen at a
# cut-off date (default 24 Sep 2026 = the paper's 3-month window) and uploads
# them, numbered as in the paper, as PDF + 300-DPI JPG. Posts to Telegram only
# when the 'post' input is ticked.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      end:
        description: "Last snapshot date to include (YYYY-MM-DD)"
        required: false
        default: "2026-09-24"
      post:
        description: "Post to the Telegram channel (one-off): none, paper (all figures in the draft), extra (built but not in the draft), all"
        type: choice
        options: [none, paper, extra, all]
        required: false
        default: none

permissions:
  contents: read

jobs:
  paper-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: report
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: report/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest v2, build paper figures up to the cut-off
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UYBOR_TABLE: ${{ vars.UYBOR_TABLE || 'uybor_listings_v2' }}
          PANEL_END: ${{ inputs.end }}
        run: |
          python pull_supabase.py
          python paper_figures.py

      - name: Post paper figures to Telegram (only if requested)
        if: inputs.post && inputs.post != 'none'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT || '@chart_automation' }}
          TELEGRAM_CHAT_EN: ${{ vars.TELEGRAM_CHAT_EN || '' }}
          POST_WHICH: ${{ inputs.post }}
        run: python paper_figures.py --post "$POST_WHICH"

      - name: Upload paper figures
        uses: actions/upload-artifact@v4
        with:
          name: paper-figures
          path: report/paper_figures/*
          if-no-files-found: error
