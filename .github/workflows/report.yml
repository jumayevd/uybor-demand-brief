---
name: uybor-report

# Primary trigger: an external cron (cron-job.org) calls the workflow_dispatch
# API at exactly 06:00 Asia/Tashkent. GitHub's own schedule lags the target time
# by hours at busy times, so it is kept only as a FALLBACK: the gate step skips
# it when a successful dispatch run already posted today (no duplicates).
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 1 * * *"   # 06:00 Asia/Tashkent
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read      # gate step lists today's runs

concurrency:
  group: uybor-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: report
    steps:
      - name: Gate (fallback schedule skips if today's post already went out)
        id: gate
        if: github.event_name == 'schedule'
        working-directory: .   # runs before checkout; report/ doesn't exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since="$(TZ=Asia/Tashkent date +%F)T00:00:00+05:00"
          n=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/report.yml/runs" \
                -f event=workflow_dispatch -f status=success \
                -f "created=>=${since}" --jq '.total_count')
          echo "successful dispatch runs since ${since}: ${n}"
          if [ "${n:-0}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's post already went out via the exact-time trigger; skipping."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: report/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Pull v2, build Uzbek figures, send to Telegram
        if: steps.gate.outputs.skip != 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UYBOR_TABLE: ${{ vars.UYBOR_TABLE || 'uybor_listings_v2' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT || '@chart_automation' }}
        run: python daily_report.py
