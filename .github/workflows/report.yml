---
name: uybor-report

# Dispatch-only: the precise 07:00 Asia/Tashkent trigger is the same external
# cron-job.org caller used for the brief (a second job pointing at this
# workflow). No `schedule` here on purpose — a delayed GitHub fallback firing
# after the dispatch would post the whole figure set to Telegram twice.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: uybor-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: report
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: report/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull v2, build 13 figures, send to Telegram
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UYBOR_TABLE: ${{ vars.UYBOR_TABLE || 'uybor_listings_v2' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT || '@chart_automation' }}
        run: python daily_report.py
