---
name: uybor-report

# Runs daily on GitHub's schedule at ~08:00 Asia/Tashkent (03:00 UTC), plus
# manual dispatch for testing. GitHub's scheduler is best-effort and may lag
# the target time by a few minutes to ~an hour; that's fine for a once-a-day
# figure post. This is the ONLY automatic trigger (no external cron), so the
# channel never receives a duplicate set.
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 3 * * *"   # 08:00 Asia/Tashkent
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: uybor-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: report
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: report/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull v2, build 13 figures, send to Telegram
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UYBOR_TABLE: ${{ vars.UYBOR_TABLE || 'uybor_listings_v2' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT || '@chart_automation' }}
        run: python daily_report.py
