---
name: uybor-report-en

# Dispatch-only. Builds the ENGLISH paper figures on the latest live data and
# uploads them (PDF + JPG) as a downloadable artifact. Does not touch Telegram.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  figures-en:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: report
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: report/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest v2, build metrics, render English figures (PDF + JPG)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UYBOR_TABLE: ${{ vars.UYBOR_TABLE || 'uybor_listings_v2' }}
        run: python build_en.py

      - name: Upload English figures
        uses: actions/upload-artifact@v4
        with:
          name: english-figures
          path: report/figures_en/*
          if-no-files-found: error
