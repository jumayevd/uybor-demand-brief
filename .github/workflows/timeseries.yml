---
name: uybor-timeseries

# Dispatch-only. Pulls the live panel and builds the 3-month, district-wise
# demand trend (24 Jun -> 24 Jul -> 24 Aug -> 24 Sep), uploading the tables
# (CSV + XLSX) and trend charts (PNG) as a downloadable artifact. No Telegram.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  timeseries:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: report
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: report/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest v2, build 3-month district trends
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UYBOR_TABLE: ${{ vars.UYBOR_TABLE || 'uybor_listings_v2' }}
        run: |
          python pull_supabase.py
          python timeseries.py

      - name: Upload time-series outputs
        uses: actions/upload-artifact@v4
        with:
          name: timeseries-monthly
          path: report/timeseries_out/*
          if-no-files-found: error
