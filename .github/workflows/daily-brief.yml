---
name: daily-brief

on:  # yamllint disable-line rule:truthy
  # Primary trigger is an external cron (cron-job.org) that calls the
  # workflow_dispatch API at exactly 07:00 Asia/Tashkent, because GitHub's own
  # schedule is best-effort and lags the target minute. The schedule below is
  # only a fallback: it runs an hour later and the gate step skips it when
  # today's brief already exists (i.e. the precise trigger already fired).
  schedule:
    - cron: "0 3 * * *"   # 08:00 Asia/Tashkent — fallback only
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Gate (fallback schedule skips if today is already done)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] \
             && [ -d "briefs/$(date -u +%F)" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Today's brief already exists; fallback schedule skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements-render.txt

      - name: Cache Playwright browser
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Refresh the brief from the live database
        if: steps.gate.outputs.run == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UYBOR_TABLE: ${{ vars.UYBOR_TABLE || 'uybor_listings_v2' }}
        run: |
          python refresh_brief.py \
            --template tashkent_demand_brief.template.html \
            --out tashkent_demand_brief.html
          cp tashkent_demand_brief.html index.html

      # Render each chart to a dated PNG folder. continue-on-error so a
      # headless-browser hiccup can never block the brief from publishing.
      - name: Render charts to dated PNG folder
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          python -m playwright install --with-deps chromium
          python render_charts.py \
            --html tashkent_demand_brief.html \
            --outdir "briefs/$(date -u +%F)"

      - name: Commit if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "brief-bot"
          git config user.email "actions@github.com"
          git add tashkent_demand_brief.html index.html briefs
          if git diff --staged --quiet; then
            echo "No data change; nothing to commit."
          else
            git commit -m "chore: daily brief refresh $(date -u +%F)"
            # rebase-then-push with retries so a concurrent push (a human, or
            # an overlapping run) can't fail the job on a fast-forward reject
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              echo "push attempt $attempt rejected; re-fetching and retrying"
              sleep 5
            done
            echo "push failed after 3 attempts" >&2
            exit 1
          fi
