---
name: uybor-data-stats

# Dispatch-only. Pulls the live panel and prints exact sample statistics for
# the paper's Data section (see report/data_stats.py). Optional end date.
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      start:
        description: "First snapshot date to include (YYYY-MM-DD)"
        required: false
        default: "2026-06-30"
      end:
        description: "Last snapshot date to include (YYYY-MM-DD)"
        required: false
        default: "2026-09-30"

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: report
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: report/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest v2 and compute sample statistics
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          UYBOR_TABLE: ${{ vars.UYBOR_TABLE || 'uybor_listings_v2' }}
          STATS_START: ${{ inputs.start }}
          STATS_END: ${{ inputs.end }}
        run: |
          python pull_supabase.py
          python data_stats.py

      - name: Upload statistics
        uses: actions/upload-artifact@v4
        with:
          name: data-stats
          path: report/data_stats.json
